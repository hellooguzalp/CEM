<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Config Editor Manager | C.E.M v0.19.21</title>
<style>
:root{--face:#f0f0f0;--rb1:#f9fafb;--bd:#a9afb6;--bd2:#c9ced4;--text:#1e2328;--muted:#5d6670;--blue:#2b6cb0;--hovbd:#7fb0dc;--sel:#cde6f9;--green:#5aa02c;--greenDk:#3f7f22;--red:#c0392b;--amber:#a86400;--navw:430px}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0}
body{height:100vh;overflow:hidden;background:#d3e0ee;color:var(--text);font:12px/1.4 "Segoe UI",Tahoma,Arial,sans-serif;display:flex;flex-direction:column}
img{-webkit-user-drag:none;user-select:none;-webkit-user-select:none;pointer-events:none}
h1,.about-logo,.titlebar .ttl{user-select:none;-webkit-user-select:none}img::selection,h1::selection{background:transparent}
.ic{width:32px;height:32px;flex:none}.ic.s{width:16px;height:16px}
.spacer{flex:1}.muted{color:var(--muted)}
/* başlık çubuğu */
.titlebar{display:flex;align-items:center;gap:10px;padding:4px 8px 4px 6px;background:linear-gradient(#fff,#e9ecef);border-bottom:1px solid var(--bd)}
.titlebar .brand{height:22px;width:auto;margin-left:4px}.titlebar .ttl{height:38px;width:auto;max-width:min(42vw,520px);object-fit:contain}.sep{width:1px;height:22px;background:var(--bd2);flex:none}
.qb{min-height:0;padding:3px;border:1px solid transparent;background:none;border-radius:2px}.qb .ic{width:20px;height:20px}
.ver{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{display:flex;align-items:center;gap:4px}.lang select{min-width:0;height:22px;padding:0 2px;outline:none;box-shadow:none}.lang select:focus{outline:none;box-shadow:none;border-color:#8c9299}
/* sekmeler + ribbon */
.tabs{display:flex;align-items:flex-end;gap:2px;padding:4px 8px 0;background:linear-gradient(#e5e8ec,#d8dce1);border-bottom:1px solid var(--bd);user-select:none}
.ftab{border:1px solid #3f7f22;border-bottom:0;background:linear-gradient(#7dbb47,#4f9a2d);color:#fff;font:inherit;font-weight:600;padding:5px 20px;margin-right:6px;border-radius:2px 2px 0 0;cursor:pointer;margin-bottom:-1px}
.ftab:hover{background:linear-gradient(#8fcb58,#5aa832)}
.tab{border:1px solid transparent;border-bottom:0;background:none;font:inherit;padding:5px 16px;border-radius:2px 2px 0 0;color:var(--text);cursor:pointer;margin-bottom:-1px}
.tab:hover:not(.on){background:#ffffffaa;border-color:var(--bd2)}
.tab.on{background:var(--rb1);border-color:var(--bd);border-top:2px solid var(--blue);padding-top:4px}
.ribbon{background:linear-gradient(#f9fafb,#e7eaed);border-bottom:1px solid var(--bd);overflow-x:auto;padding:4px 6px 0;user-select:none}
.rpage{display:flex;align-items:stretch}
.grp{display:flex;flex-direction:column;padding:0 6px;border-right:1px solid var(--bd2);box-shadow:1px 0 0 #fff}
.gbody{display:flex;gap:2px;align-items:flex-start;flex:1;padding:2px 0}
.glabel{text-align:center;color:#3d4954;font-size:11px;padding:2px 0 3px;white-space:nowrap;user-select:none;-webkit-user-select:none}
.rb{display:flex;align-items:center;gap:6px;background:none;border:1px solid transparent;border-radius:2px;padding:3px 6px;color:var(--text);cursor:pointer;font:inherit;text-align:left;white-space:nowrap;overflow:hidden}
.rb.big{flex-direction:column;justify-content:flex-start;width:76px;min-width:76px;height:78px;padding:6px 8px 4px;gap:4px;text-align:center;line-height:1.25}
.rb.big>.ic{flex:none}.rb.big>span{display:flex;align-items:flex-start;justify-content:center;min-height:30px;width:100%;text-align:center;white-space:pre-line}
.lb{white-space:pre-line}
.rb:hover:not(:disabled),.qb:hover:not(:disabled){background:linear-gradient(#eaf4fd,#cde4f8);border-color:var(--hovbd)}
.rb:active:not(:disabled),.qb:active:not(:disabled){background:linear-gradient(#b6d4ee,#cfe3f5);border-color:#4b8cc4}
.rb:disabled,.qb:disabled{color:#8b949d;cursor:default}.rb:disabled .ic,.qb:disabled .ic{opacity:.48}
.stack{display:flex;flex-direction:column;justify-content:center;height:78px;width:172px}
#folder.rb.big{width:100px;min-width:100px}
#exportCsv.rb.big{width:92px;min-width:92px}
.infobar{display:flex;align-items:center;gap:8px;padding:4px 10px;background:linear-gradient(#f4f6f8,#e8ebee);border-bottom:1px solid var(--bd)}
.infobar code{flex:1;background:#fff;border:1px solid #8c9299;padding:2px 8px;font:12px Consolas,monospace;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* çalışma alanı */
.work{flex:1;min-height:0;display:grid;grid-template-columns:var(--navw) 5px minmax(0,1fr)}
.split{cursor:col-resize;background:linear-gradient(90deg,#c9ced4,#e9ecef,#c9ced4);border-left:1px solid var(--bd);border-right:1px solid var(--bd)}
.nav{display:grid;grid-template-columns:28px minmax(0,1fr);background:#fff;min-height:0;min-width:0}
.nstrip{display:flex;flex-direction:column;background:linear-gradient(90deg,#e6e9ed,#d3d8dd);border-right:1px solid var(--bd)}
.nt{border:0;border-bottom:1px solid var(--bd2);background:none;padding:8px 0;min-height:0;border-radius:0;justify-content:center;width:100%}
.nt .ic{width:18px;height:18px}.nt.on{background:#fff;box-shadow:inset 3px 0 0 var(--blue)}.nt:hover:not(.on){background:#f3f7fb}
.npane{display:flex;flex-direction:column;min-width:0;min-height:0}
.nhead{display:flex;gap:8px;align-items:center;padding:4px 6px;background:linear-gradient(#fbfbfc,#e8ebee);border-bottom:1px solid var(--bd)}
.nhead input[type=text]{flex:1;min-width:0}
.ncols{display:flex;gap:6px;padding:2px 6px 2px 34px;background:linear-gradient(#fafafb,#e4e7ea);border-bottom:1px solid var(--bd2);font-weight:600;color:#2b333b;user-select:none}
.ncols span:first-child{flex:1;min-width:110px}.ncols .col{font-weight:600;cursor:pointer}.ncols .col:hover{color:var(--blue)}.ncols .col.sorted{color:var(--blue)}
.ncols .col.sz{width:54px;text-align:right}.ncols .col.tm{width:72px;text-align:right}
.nbody{flex:1;overflow:auto;min-height:0}
.nfoot{padding:3px 8px;border-top:1px solid var(--bd2);background:#f4f6f8;color:var(--muted);font-size:11px}
.tr{display:flex;align-items:center;gap:6px;padding:2px 6px;white-space:nowrap;min-height:22px;cursor:default}
.tr.day,.tr.root,.tr.tg{cursor:pointer}.tr.it{padding-left:34px}
.tr:hover{background:#e8f3fc}.tr.sel{background:var(--sel)}.tr.cur{outline:1px solid var(--hovbd);outline-offset:-1px}
.tr.day{padding-left:16px}.arw{width:10px;font-size:9px;color:var(--muted)}.cnt{color:var(--muted)}
.nm{flex:1 1 150px;min-width:110px;overflow:hidden;text-overflow:ellipsis}
.col{width:62px;text-align:right;color:var(--muted);font-size:11px;flex:none}.col.sz{width:54px}.col.tm{width:72px}
.tags{display:flex;gap:3px;flex:none;max-width:180px;overflow:hidden}
.tag{display:inline-block;max-width:90px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px;border-radius:2px;font-size:11px;color:#fff;flex:none}
.status{border-radius:2px;padding:0 6px;font-size:11px;border:1px solid #a9d48f;color:var(--greenDk);background:#eef8e8;flex:none}
.fav{width:16px;height:16px;flex:none;cursor:pointer;opacity:.85}.fav:hover{opacity:1}
.desc{font-size:11px;color:var(--muted);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
/* grafik penceresi */
.gfx{display:flex;flex-direction:column;min-width:0;min-height:0;padding:8px;gap:8px;background:linear-gradient(180deg,#9db5d1 0,#d3e0ee 45%,#f3f6fa 100%)}
.msgarea{flex:none;height:84px;overflow-y:scroll;overflow-x:hidden;background:#fff;border:1px solid #8c96a0;box-shadow:0 1px 3px #0003;padding:2px 0;scrollbar-gutter:stable}
.m{display:flex;align-items:center;gap:0;padding:1px 8px 1px 6px;min-height:18px;line-height:18px;box-sizing:border-box}
.m .mi{width:18px;height:18px;flex:none;display:flex;align-items:center;justify-content:center}
.m .mi svg{width:14px;height:14px;display:block}
.m .mt{width:66px;flex:none;color:#8a96a3;font:11px/18px Consolas,"Segoe UI",monospace;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.m .mx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:4px}
.m.err{color:var(--red)}
.m.ok{color:var(--greenDk)}
.m.warn{color:var(--amber)}
.m.info{color:var(--text)}
.win{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;border:1px solid #8c96a0;box-shadow:0 1px 3px #0003}
.wtabs{display:flex;gap:1px;padding:4px 4px 0;background:linear-gradient(#e9ecef,#d9dde2);border-bottom:1px solid var(--bd)}
.wt{border:1px solid transparent;border-bottom:0;background:none;padding:3px 14px;border-radius:2px 2px 0 0;margin-bottom:-1px;min-height:0}
.wt:hover:not(.on){background:#ffffffaa;border-color:var(--bd2)}.wt.on{background:#fff;border-color:var(--bd);border-top:2px solid var(--blue);padding-top:2px}
.wpanel{flex:1;min-height:0;display:flex;flex-direction:column}
.wtool{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:4px 8px;background:linear-gradient(#fbfbfc,#e8ebee);border-bottom:1px solid var(--bd)}
.wbody{flex:1;min-height:0;overflow:auto;padding:10px}
.wbody.gradient{background:linear-gradient(180deg,#9db5d1,#f3f6fa);display:grid;place-items:center}.emptyv{color:#3f5368;font-size:13px;text-align:center}
.wbody.code{padding:4px 0;font:12px/1.5 Consolas,monospace}
.ln{display:grid;grid-template-columns:52px 1fr;white-space:pre-wrap;word-break:break-all}.ln i{color:#8a98a6;font-style:normal;text-align:right;padding-right:12px;user-select:none;background:#f3f5f7}.ln b.opt{color:var(--blue);cursor:help;border-bottom:1px dotted transparent}.ln b.opt:hover{border-bottom-color:var(--blue);background:#e8f3fc}.ln .cm{color:#4a8a2a;font-style:italic}
#optTip{position:fixed;z-index:50;max-width:360px;min-width:200px;background:#fffef8;border:1px solid #8c96a0;box-shadow:2px 4px 14px #0004;padding:8px 10px;font:12px/1.45 "Segoe UI",Tahoma,sans-serif;color:var(--text);pointer-events:none;display:none}
#optTip .ot-name{font-family:Consolas,monospace;font-weight:700;color:var(--blue);margin-bottom:4px}
#optTip .ot-body{color:#1e2328}#optTip .ot-en{color:#1e2328;margin-bottom:6px;line-height:1.4}#optTip .ot-tr{color:#1a4a7a;border-top:1px dashed #d0d5da;padding-top:6px;margin-top:2px;line-height:1.4}
#optTip .ot-ai{margin-top:6px;font-size:10px;color:var(--muted);border-top:1px solid #e8ebef;padding-top:4px}
#optTip .ot-wait{color:var(--muted);font-style:italic}
.diff{font:12px Consolas,monospace;white-space:pre-wrap;overflow:auto;max-height:100%;background:#fff;border:1px solid #8c9299;padding:6px}
.diff div{padding:1px 6px}.add{color:#2e7d32;background:#edf7ee}.remove{color:#c62828;background:#fdeeee}.change{color:var(--amber);background:#fdf4e3}
.sline{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.sline .chip{border:1px solid var(--bd2);padding:2px 10px;border-radius:2px;background:#f6f8fa;cursor:pointer;user-select:none;font:inherit;display:inline-flex;align-items:center;gap:4px}
.sline .chip:hover{border-color:var(--hovbd);background:#eef6fd}
.sline .chip.on{box-shadow:inset 0 0 0 1px currentColor;font-weight:600}
.sline .chip.on.addc{background:#edf7ee;border-color:#6aaa6a;color:var(--greenDk)}
.sline .chip.on.remc{background:#fdeeee;border-color:#d08080;color:var(--red)}
.sline .chip.on.chgc{background:#fdf4e3;border-color:#d0a860;color:var(--amber)}
.sline .chip.on.samc{background:#eef1f4;border-color:#8a96a3;color:#3d4954}
.sline .chip:not(.on){opacity:.4}
.diff div[data-kind]{padding:1px 6px}
.diff .hid{display:none!important}
.note{border:1px solid var(--bd2);border-left:3px solid var(--blue);background:#fafbfc;padding:8px 12px;margin-bottom:10px}.note h3{margin:0 0 4px;font-size:13px}.note p{margin:4px 0}.note a{color:var(--blue)}
.path{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}.path code{background:#fff;border:1px solid #8c9299;padding:2px 8px;font:12px Consolas,monospace;word-break:break-all}
/* genel kontroller */
:where(button){font:inherit;border:1px solid #8c9299;background:linear-gradient(#fdfdfd,#e1e4e8);color:var(--text);padding:3px 12px;border-radius:2px;cursor:pointer;min-height:24px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
:where(button:hover:not(:disabled)){background:linear-gradient(#eef6fd,#d2e6f8);border-color:#3c7fb1}
:where(button:active:not(:disabled)){background:linear-gradient(#bcd7ef,#d3e5f5);border-color:#2c628b}
:where(button:disabled){opacity:.5;cursor:default}
button:focus-visible{outline:1px dotted #000;outline-offset:-4px}
button.primary{border-color:#3c7fb1;box-shadow:0 0 0 1px #8fbfe6 inset}
button.sm{padding:1px 8px;min-height:20px;font-size:11px}
input[type=text],select{background:#fff;border:1px solid #8c9299;border-radius:1px;padding:3px 6px;font:inherit;color:var(--text);min-width:150px;height:24px}
input[type=text]:focus,select:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 1px var(--blue) inset}
input[type=checkbox]{width:14px;height:14px;accent-color:#2b6cb0;cursor:pointer;margin:0;flex:none}
.statusbar{display:flex;align-items:center;flex-wrap:wrap;background:linear-gradient(#eef0f3,#d7dbe0);border-top:1px solid var(--bd);font-size:11.5px}
.statusbar>*{padding:3px 8px;border-right:1px solid var(--bd2)}
.pill{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}.pill::before{content:"";width:9px;height:9px;border-radius:50%;background:#aab2ba}.pill.ok{color:var(--greenDk)}.pill.ok::before{background:var(--green)}
dialog{padding:0;border:1px solid #6f7a85;border-radius:2px;background:var(--face);color:var(--text);box-shadow:0 8px 30px #0006;max-width:550px;width:calc(100% - 30px)}dialog::backdrop{background:#1e283344}
.dhead{display:flex;align-items:center;gap:8px;padding:5px 6px 5px 10px;background:linear-gradient(#fff,#e3e7eb);border-bottom:1px solid var(--bd);font-weight:600}
.dhead .x{margin-left:auto;border:0;background:none;min-height:0;padding:2px 10px;font-size:13px;border-radius:0}.dhead .x:hover:not(:disabled){background:#e81123;color:#fff}
.dbody{padding:14px}.dfoot{display:flex;justify-content:flex-end;gap:8px;padding:0 14px 12px}
#ctx{position:fixed;z-index:20;min-width:190px;background:#fff;border:1px solid #8c96a0;box-shadow:2px 3px 8px #0004;padding:2px}
.ci{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 6px;cursor:default}.ci:hover:not(.off){background:var(--sel)}.ci.off{color:#9aa3ac}.ci.off .ic{filter:grayscale(1) opacity(.4)}.csep{height:1px;background:var(--bd2);margin:2px 0}
::-webkit-scrollbar{width:17px;height:17px}::-webkit-scrollbar-track{background:#f0f0f0}::-webkit-scrollbar-thumb{background:#cdcdcd;border:1px solid #f0f0f0}::-webkit-scrollbar-thumb:hover{background:#a6a6a6}::-webkit-scrollbar-corner{background:#f0f0f0}
@media(max-width:820px){body{height:auto;overflow:auto}.work{grid-template-columns:1fr}.split{display:none}.nav{max-height:55vh}.gfx{min-height:70vh}.titlebar .ttl{height:30px;max-width:48vw}}
.about-logo{text-align:center;margin:18px 0 0}.about-logo img{height:42px;max-width:75%;width:auto;object-fit:contain;display:inline-block;-webkit-user-drag:none;user-select:none;pointer-events:none}
.wn-filters{display:flex;gap:4px;align-items:center}.wn-filters button{min-height:22px;padding:2px 8px;border:1px solid var(--bd);background:#fff;border-radius:2px;cursor:pointer;font:11px "Segoe UI",Tahoma,Arial,sans-serif}.wn-filters button.on{background:var(--sel);border-color:var(--blue);color:#1e3a5f;font-weight:600}
.wdtext{cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw;display:inline-block;vertical-align:bottom}
.wdtext:hover{text-decoration:underline}
.vold{color:#b42318;background:#fde2e0;border-radius:2px;padding:0 3px;font-weight:600;text-decoration:line-through;text-decoration-thickness:1px}
.vnew{color:#116329;background:#d4f4dd;border-radius:2px;padding:0 3px;font-weight:600}
body.dark #wnBody thead tr{background:#2a313a!important}body.dark .vold{color:#ff9b93!important;background:#4a1e1e!important}body.dark .vnew{color:#7ee2a0!important;background:#16392a!important}
#w-notes details.note{border:1px solid var(--bd);border-radius:3px;margin:0 0 8px;background:#fff;overflow:hidden;transition:border-color .2s ease,box-shadow .2s ease}
#w-notes details.note:hover{border-color:#7fb0dc}
#w-notes details.note[open]{border-color:#7fb0dc;box-shadow:0 1px 4px #2b6cb014}
#w-notes details.note summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:8px 10px;font-weight:600;user-select:none;transition:background .18s ease}
#w-notes details.note summary::-webkit-details-marker{display:none}
#w-notes details.note summary:hover{background:#f3f7fb}
#w-notes details.note summary .chev{flex:none;width:14px;height:14px;color:var(--blue);transition:transform .28s cubic-bezier(.4,0,.2,1)}
#w-notes details.note[open] summary .chev{transform:rotate(90deg)}
#w-notes details.note[open] summary{border-bottom:1px solid var(--bd);background:#f5f8fb}
#w-notes details.note .nbody{padding:9px 12px 10px 32px;animation:accOpen .3s cubic-bezier(.4,0,.2,1)}
@keyframes accOpen{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
#w-notes details.note .nbody p{margin:0 0 6px}
#w-notes details.note .nbody .path{margin:6px 0}
.nav{display:flex;flex-direction:column}
.navsec{flex:none;border-top:1px solid var(--bd);background:var(--face)}
.navsec .nhead.acc{cursor:pointer;user-select:none;display:flex;align-items:center;gap:7px;padding:6px 8px}
.navsec .nhead.acc:hover{background:#eef3f8}
.navsec .nhead.acc .chev{width:12px;height:12px;color:var(--blue);transition:transform .25s cubic-bezier(.4,0,.2,1)}
.navsec.open .nhead.acc .chev{transform:rotate(90deg)}
.navsec .nbody{max-height:180px;overflow:auto;border-top:1px solid var(--bd);animation:accOpen .25s cubic-bezier(.4,0,.2,1)}
#themeBtn{position:relative;width:26px;height:22px;display:flex;align-items:center;justify-content:center}
#themeBtn .sun,#themeBtn .moon{position:absolute;transition:opacity .3s ease,transform .45s cubic-bezier(.4,0,.2,1);transform-origin:center}
#themeBtn .sun{opacity:0;transform:rotate(90deg) scale(.5)}
#themeBtn .moon{opacity:1;transform:none}
body.dark #themeBtn .sun{opacity:1;transform:none}
body.dark #themeBtn .moon{opacity:0;transform:rotate(-90deg) scale(.5)}
#themeBtn,#themeBtn:hover,#themeBtn:active{background:none!important;border-color:transparent!important;box-shadow:none!important;filter:none!important}
#themeBtn{transition:none!important}

/* ===== KOYU TEMA (kapsamlı) ===== */
body.dark{--face:#22272f;--rb1:#2a313a;--bd:#3a424d;--bd2:#313842;--text:#e7ebf0;--muted:#9aa4b0;--sel:#1d3a57;--hovbd:#3b82c4;background:#15181d;color:var(--text)}
body.dark .titlebar{background:linear-gradient(#2a313a,#22272f)!important;border-bottom:1px solid var(--bd)!important}
body.dark .infobar{background:#22272f!important;border-color:var(--bd)!important;color:var(--muted)!important}
body.dark .work{background:#15181d!important}
body.dark .nav,body.dark .npane,body.dark .navsec,body.dark .nbody,body.dark .msgarea,body.dark .win,body.dark .wpanel{background:#1b2026!important;color:var(--text)!important;border-color:var(--bd)!important}
body.dark .nhead,body.dark .ncols,body.dark .nfoot,body.dark .wtool{background:#22272f!important;color:var(--muted)!important;border-color:var(--bd)!important}
body.dark .wtabs{background:linear-gradient(#2a313a,#22272f)!important;border-bottom:1px solid var(--bd)!important}
body.dark .wt{background:#2a313a!important;color:var(--text)!important;border-color:var(--bd)!important}
body.dark .wt.on{background:#1b2026!important;color:#cfe3f7!important}
body.dark input,body.dark select,body.dark textarea{background:#22272f!important;color:var(--text)!important;border-color:var(--bd)!important}
body.dark .ribbon{background:linear-gradient(#2a313a,#22272f)!important;border-bottom:1px solid var(--bd)!important}
body.dark .grp{border-color:var(--bd)!important}
body.dark .gbody{background:#2a313a!important}
body.dark .glabel{background:#22272f!important;color:var(--muted)!important}
body.dark .rb{background:linear-gradient(#333b46,#2a313a)!important;color:var(--text)!important;border-color:var(--bd)!important}

let LANG="tr";
try{const s=localStorage.getItem(LKEY);LANG=s&&I18N[s]?s:((navigator.language||"tr").toLowerCase().startsWith("tr")?"tr":"en")}catch{}
const t=(k,...a)=>{let s=I18N[LANG][k]??I18N.tr[k]??k;a.forEach((v,i)=>s=s.replaceAll("{"+i+"}",()=>String(v)));return s};
const loc=()=>LANG==="tr"?"tr-TR":"en-GB";

let currentFile=null,directoryHandle=null,backups=[],sel=new Set(),cur=null,connState="conn_none",connOk=false,stateKey="st_wait",gfxTab="content",collapsed=new Set(),tagIds=[],msgs=[],lastCmp=null,sortKey="date",sortDir=-1,nameFormat="config_YYYYMMDD_HHMMSS.pro";
const find=id=>backups.find(x=>x.id===id);
const latestEntry=()=>{if(!backups.length)return null;let best=backups[0];for(const x of backups){if(new Date(x.date)>new Date(best.date))best=x}return best};
const getTags=x=>(x.tag||"").split(",").map(s=>s.trim()).filter(Boolean);
const tagsHtml=x=>getTags(x).map(tg=>`<span class="tag" style="background:${tagColor(tg)}">${escapeHtml(tg)}</span>`).join("");
const pad=n=>String(n).padStart(2,"0");
const dateStamp=(d=new Date())=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
const humanDate=s=>new Date(s).toLocaleString(loc(),{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit"});
const timeLabel=s=>new Date(s).toLocaleTimeString(loc());
const dayKey=s=>{const d=new Date(s);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const dayLabel=k=>{const [y,m,d]=k.split("-");return new Date(+y,m-1,+d).toLocaleDateString(loc(),{day:"2-digit",month:"2-digit",year:"numeric"})};
const sizeText=n=>n<1024?n+" B":n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(2)+" MB";
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tagColor=tg=>{let h=0;for(const c of tg)h=(h*31+c.charCodeAt(0))%360;return `hsl(${h} 42% 38%)`};

/* ---- mesaj alanı (Creo message area) ---- */
const ICON={info:"i-info",ok:"i-ok",warn:"i-warn",err:"i-err"};
function msg(type,key,...args){msgs.push({type,key,args,time:new Date()});if(msgs.length>100)msgs.shift();drawMsgs()}
function drawMsgs(){const el=$("msgs");
 const pad=n=>String(n).padStart(2,"0");
 const fmt=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
 el.innerHTML=msgs.map(m=>`<div class="m ${m.type}"><span class="mi"><svg class="ic s"><use href="#${ICON[m.type]}"/></svg></span><span class="mt">${fmt(m.time)}</span><span class="mx">${escapeHtml(t(m.key,...m.args))}</span></div>`).join("");
 el.scrollTop=el.scrollHeight}
function notice(title,text){$("modalTitle").textContent=title;$("modalText").textContent=text;$("modal").showModal()}

/* ---- dil ---- */
function applyI18n(){
 document.documentElement.lang=LANG;$("lang").value=LANG;
 document.querySelectorAll("[data-i18n]").forEach(e=>e.textContent=t(e.dataset.i18n));
 document.querySelectorAll("[data-i18n-html]").forEach(e=>e.innerHTML=t(e.dataset.i18nHtml));
 document.querySelectorAll("[data-i18n-ph]").forEach(e=>e.placeholder=t(e.dataset.i18nPh));
 document.querySelectorAll("[data-i18n-title]").forEach(e=>{const tt=t(e.dataset.i18nTitle).replace(/\n/g," ");e.title=tt;e.setAttribute("aria-label",tt)});
 renderStatus();drawMsgs();render()}
$("lang").onchange=e=>{LANG=e.target.value;try{localStorage.setItem(LKEY,LANG)}catch{}applyI18n()};
function renderStatus(){
 $("connection").textContent=t(connState);$("connection").className=connOk?"pill ok":"pill";
 $("active").textContent=currentFile?currentFile.name:t("not_sel");
 $("filepath").textContent=currentFile?currentFile.name:t("no_file");
 const s=$("state");s.textContent=t(stateKey);s.style.color=stateKey==="st_wait"?"var(--muted)":"var(--greenDk)"}

/* ---- veri ---- */
function load(){try{backups=JSON.parse(localStorage.getItem(DBKEY)||"[]")}catch{backups=[]}
 if(!Array.isArray(backups))backups=[];
 backups=backups.filter(x=>x&&typeof x==="object"&&x.id&&typeof x.text==="string"&&x.name&&x.date&&!isNaN(new Date(x.date)));
 backups.forEach(x=>{if(x.fav==null)x.fav=false;if(x.note==null)x.note="";if(x.tag==null)x.tag="";if(typeof x.size!=="number")x.size=x.text.length;if(x.source==null)x.source=""})}
function save(){try{localStorage.setItem(DBKEY,JSON.stringify(backups))}catch(e){msg("err","m_storage")}}

/* ---- dosya / klasör ---- */
function setFile(h,ro){currentFile=h;connState=ro?"conn_ro":"conn_ok";connOk=!ro;stateKey="st_ready";renderStatus();msg("ok","m_filesel",h.name);render()}
$("choose").onclick=$("qOpen").onclick=async()=>{try{
 if(window.showOpenFilePicker){const [h]=await showOpenFilePicker({multiple:false,types:[{description:"Creo config.pro",accept:{"text/plain":[".pro",".txt"]}}]});setFile(h,false)}
 else{const inp=document.createElement("input");inp.type="file";inp.accept=".pro,.txt";inp.onchange=()=>{const f=inp.files[0];if(f)setFile({name:f.name,getFile:async()=>f},true)};inp.click()}
}catch(e){if(e.name!=="AbortError")msg("err","m_filefail",e.message)}};
$("folder").onclick=async()=>{try{
 if(!window.showDirectoryPicker){msg("warn","m_nosupport");return}
 directoryHandle=await showDirectoryPicker({mode:"readwrite"});msg("ok","m_foldersel");
 try{
  const nm=directoryHandle.name||"";let savedWd="",savedNm="";
  try{savedWd=localStorage.getItem("cem_wdpath")||"";savedNm=localStorage.getItem("cem_wdname")||""}catch{}
  if(!(savedWd&&savedNm===nm)){ // farklı (veya ilk) klasör: yolu yeniden sor
   const p=prompt(t("wd_prompt"),"C:\\"+(nm||"CEM"));
   savedWd=p&&p.trim()?normWd(p):"";
   try{if(savedWd){localStorage.setItem("cem_wdpath",savedWd);localStorage.setItem("cem_wdname",nm)}else{localStorage.removeItem("cem_wdpath");localStorage.removeItem("cem_wdname")}}catch{}
  }
  $("wdPath").textContent=savedWd?dispWd(savedWd):(nm||"C.E.M");
 }catch{}
}catch(e){if(e.name!=="AbortError")msg("err","m_folderfail",e.message)}};
async function writeBackup(blob,name){
 if(directoryHandle){try{const h=await directoryHandle.getFileHandle(name,{create:true});const w=await h.createWritable();await w.write(blob);await w.close();return "folder"}catch(e){msg("warn","m_folderwrite",e.message)}}
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);return "download"}

/* ---- yedekleme / geri yükleme ---- */
async function doBackup(){try{
 if(!currentFile)return;const f=await currentFile.getFile();
 const text=await f.text(),stamp=dateStamp();let name=`config_${stamp}.pro`;for(let k=2;backups.some(b=>b.name===name);k++)name=`config_${stamp}_${k}.pro`;
 const dest=await writeBackup(new Blob([text],{type:"text/plain;charset=utf-8"}),name);
 backups.unshift({id:stamp+"_"+Math.random().toString(36).slice(2,7),date:new Date().toISOString(),name,source:currentFile.name,size:f.size,text,destination:dest,tag:"",note:"",fav:false});
 backups=backups.slice(0,MAX);save();cur=backups[0].id;sel=new Set([cur]);stateKey="st_done";renderStatus();render();
 const wp=(typeof wdRaw==="function"?wdRaw():"").trim();const tl=dest==="folder"?((wp&&wp!=="—"&&wp!=="-")?wp:(directoryHandle&&directoryHandle.name)||t("t_folder")):t("t_download");msgs.push({type:"ok",key:"m_backup_ok",args:[name,tl],time:new Date()});drawMsgs()
}catch(e){msg("err","m_backfail",e.message)}}
$("backup").onclick=$("qSave").onclick=doBackup;
async function restoreEntry(entry){
 if(!entry)return;
 if(!currentFile){msg("warn","m_nofile");return}
 if(currentFile.queryPermission){ // izin, tıklamanın hemen ardından (confirm'den ÖNCE) istenmeli
  try{let p=await currentFile.queryPermission({mode:"readwrite"});if(p!=="granted")p=await currentFile.requestPermission({mode:"readwrite"});
   if(p!=="granted"){msg("warn","m_noperm");return}}catch(e){msg("err","m_permerr",e.message);return}}
 if(!confirm(t("confirm_restore",entry.name)))return;
 try{
  if(currentFile.createWritable){const w=await currentFile.createWritable();await w.write(entry.text);await w.close();msg("ok","m_restore_ok",entry.name)}
  else{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([entry.text],{type:"text/plain"}));a.download=currentFile.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);msg("warn","m_restore_dl",currentFile.name)}
 }catch(e){msg("err","m_restfail",e.message)}}
$("restore").onclick=$("qRestore").onclick=()=>restoreEntry(latestEntry());
$("restoreSelected").onclick=()=>restoreEntry(find([...sel][0]));

/* ---- ağaç ---- */
const visible=()=>{
 const q=$("search").value.toLowerCase();
 let rows=backups.filter(x=>[x.name,x.source,x.tag||"",humanDate(x.date)].join(" ").toLowerCase().includes(q));
 const dir=sortDir;
 rows=[...rows].sort((a,b)=>{
  if(a.fav!==b.fav)return a.fav?-1:1; // favoriler üstte
  let va,vb;
  if(sortKey==="name"){va=a.name.toLowerCase();vb=b.name.toLowerCase()}
  else if(sortKey==="size"){va=a.size;vb=b.size}
  else{va=new Date(a.date).getTime();vb=new Date(b.date).getTime()}
  if(va<vb)return -1*dir;if(va>vb)return 1*dir;return 0;
 });
 return rows};
function renderTree(){
 const rows=visible(),groups=[];
 // when sorting by date keep day grouping, otherwise flat
 if(sortKey==="date"){
  rows.forEach(x=>{const k=dayKey(x.date);let g=groups[groups.length-1];if(!g||g.k!==k){g={k,items:[]};groups.push(g)}g.items.push(x)});
 }else{
  groups.push({k:"all",items:rows});
 }
 let h=`<div class="tr root"><span class="arw">▾</span><svg class="ic s"><use href="#i-file"/></svg><b>${escapeHtml(currentFile?currentFile.name:"config.pro")}</b> <span class="muted" style="font-weight:400;font-size:11px">(${nameFormat})</span></div>`;
 if(!rows.length)h+=`<div class="empty">${t(backups.length?"no_match":"no_backups")}</div>`;
 groups.forEach(g=>{
  if(g.k!=="all"){
   const c=collapsed.has(g.k);
   h+=`<div class="tr day" data-day="${g.k}"><span class="arw">${c?"▸":"▾"}</span><svg class="ic s"><use href="#i-folder"/></svg><span>${escapeHtml(dayLabel(g.k))}</span><span class="cnt">(${g.items.length})</span></div>`;
   if(c)return;
  }
  g.items.forEach(x=>{const id=escapeHtml(x.id);
   const latest=latestEntry();const isLatest=latest&&latest.id===x.id;
   const tip=[humanDate(x.date),x.note||""].filter(Boolean).join(" · ");
   const star=x.fav?`<svg class="fav" data-fav="1" title="${escapeHtml(t("b_unfav"))}"><use href="#i-star"/></svg>`:`<svg class="fav" data-fav="0" title="${escapeHtml(t("b_fav"))}"><use href="#i-star-o"/></svg>`;
   h+=`<div class="tr it${sel.has(x.id)?" sel":""}${cur===x.id?" cur":""}" data-id="${id}" title="${escapeHtml(tip)}"><input type="checkbox" ${sel.has(x.id)?"checked":""} aria-label="${escapeHtml(t("select"))}">${star}<svg class="ic s"><use href="#i-file"/></svg><span class="nm" title="${escapeHtml(x.name)}">${escapeHtml(x.name)}</span><span class="tags">${tagsHtml(x)}</span>${x.note?`<span class="desc" title="${escapeHtml(x.note)}">${escapeHtml(x.note)}</span>`:""}${isLatest?`<span class="status">${t("latest")}</span>`:""}<span class="col tm">${timeLabel(x.date)}</span><span class="col sz">${sizeText(x.size)}</span></div>`});
 });
 $("tree").innerHTML=h;
 // sort indicators
 document.querySelectorAll(".ncols .col").forEach(c=>{
  c.classList.toggle("sorted",c.dataset.sort===sortKey);
  const arrow=sortKey===c.dataset.sort?(sortDir>0?" ▲":" ▼"):"";
  const base=t(c.dataset.sort==="name"?"col_name":c.dataset.sort==="size"?"col_size":"col_time");
  c.textContent=base+arrow;
 });
 const n=rows.filter(x=>sel.has(x.id)).length;$("all").checked=rows.length>0&&n===rows.length;$("all").indeterminate=n>0&&n<rows.length}
function renderTags(){
 const favs=backups.filter(x=>x.fav);
 $("favlist").innerHTML=favs.length?favs.map(x=>`<div class="tr fv" data-fav="${escapeHtml(x.id)}"><svg class="ic s"><use href="#i-star"/></svg><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(x.name)}</span></div>`).join(""):`<div class="empty">${t("no_favs")}</div>`;
 const c={};backups.forEach(x=>getTags(x).forEach(tg=>{c[tg]=(c[tg]||0)+1}));const k=Object.keys(c).sort();
 $("taglist").innerHTML=k.length?k.map(x=>`<div class="tr tg" data-tag="${escapeHtml(x)}"><svg class="ic s"><use href="#i-tag"/></svg><span class="tag" style="background:${tagColor(x)}">${escapeHtml(x)}</span><span class="cnt">(${c[x]})</span></div>`).join(""):`<div class="empty">${t("no_tags")}</div>`}
$("taglist").onclick=e=>{const r=e.target.closest("[data-tag]");if(!r)return;$("search").value=r.dataset.tag;render()};
$("favlist").onclick=e=>{const r=e.target.closest("[data-fav]");if(!r)return;cur=r.dataset.fav;sel=new Set([cur]);viewSelected()};
function setNav(n){if(n==="tags")toggleSec("secTag");else if(n==="favs")toggleSec("secFav")}
function toggleSec(id){const sec=$(id);const body=sec.querySelector(".nbody");const open=body.hidden;body.hidden=!open;sec.classList.toggle("open",open)}
$("favHead").onclick=()=>toggleSec("secFav");
$("tagHead").onclick=()=>toggleSec("secTag");

$("tree").onclick=e=>{

function wordDiff(a,b){
 a=String(a);b=String(b);
 let i=0;while(i<a.length&&i<b.length&&a[i]===b[i])i++;
 let j=0;while(j<a.length-i&&j<b.length-i&&a[a.length-1-j]===b[b.length-1-j])j++;
 const pre=escapeHtml(a.slice(0,i)),suf=escapeHtml(a.slice(a.length-j));
 const midA=escapeHtml(a.slice(i,a.length-j)),midB=escapeHtml(b.slice(i,b.length-j));
 return pre+'<span class="vold">'+midA+'</span>'+suf+' &gt;&gt; '+escapeHtml(b.slice(0,i))+'<span class="vnew">'+midB+'</span>'+escapeHtml(b.slice(b.length-j));
}
function normWd(p){p=String(p||"").trim().replace(/\//g,"\\");return p}
function dispWd(p){return normWd(p).replace(/\\/g," \\ ")}
function viewSelected(){const id=cur&&find(cur)?cur:[...sel][0];if(!id)return;cur=id;setGfx("content");render()}
function removeEntries(ids){
 if(!ids.length)return;if(!confirm(t("confirm_delete",ids.length)))return;
 backups=backups.filter(x=>!ids.includes(x.id));ids.forEach(id=>sel.delete(id));save();msg("info","m_deleted",ids.length);render()}
function compareSelection(){
 if(backups.length<2){msg("warn","c_need");return}
 const ids=backups.map(x=>x.id);let a,b;
 if(sel.size===2)[a,b]=[...sel];
 else if(sel.size===1){a=[...sel][0];const i=ids.indexOf(a);b=ids[i+1]||ids[i-1]}
 if(!a||!b){msg("warn","c_need");return}
 if(ids.indexOf(a)<ids.indexOf(b))[a,b]=[b,a]; // sol: eski, sağ: yeni
 $("left").value=a;$("right").value=b;doCompare();setGfx("compare")}

function openTag(ids){
 if(!ids.length)return;tagIds=ids;$("tagTitle").textContent=ids.length>1?t("tag_title_n",ids.length):t("tag_title");
 $("tagInput").value=ids.length===1?(find(ids[0])?.tag||""):"";

 $("descInput").placeholder=t("desc_ph");
 const all=[...new Set(backups.flatMap(x=>getTags(x)))];
 $("tagList").innerHTML=all.map(x=>`<option value="${escapeHtml(x)}">`).join("");
 $("tagDialog").showModal();$("tagInput").focus()}
function saveTag(){const v=$("tagInput").value.split(",").map(s=>s.trim()).filter(Boolean).join(", ").slice(0,120);const noteRaw=$("descInput").value;const note=noteRaw.trim().slice(0,300);const multi=tagIds.length>1;const noteTouched=noteRaw.length>0||!multi;backups.forEach(x=>{if(tagIds.includes(x.id)){x.tag=v;if(noteTouched)x.note=note}});save();msg("ok","m_tagged",tagIds.length);render();$("tagDialog").close()}
$("tagSave").onclick=saveTag;$("tagCancel").onclick=()=>$("tagDialog").close();$("tagInput").onkeydown=e=>{if(e.key==="Enter")saveTag()};
function toggleFav(ids){
 if(!ids.length)return;
 const on=!ids.every(id=>find(id)?.fav);
 ids.forEach(id=>{const x=find(id);if(x)x.fav=on});
 save();msg("ok",on?"fav_added":"fav_removed");render()}
$("tree").addEventListener("click",e=>{
 const star=e.target.closest(".fav");if(!star)return;
 e.stopPropagation();
 const row=star.closest(".it");if(!row)return;
 const id=row.dataset.id;toggleFav([id]);
});

let optTipTimer=null, optTipOpt=null;
function explainOpt(name){
 const n=(name||"").toLowerCase().trim();
 if(!n)return {en:"",tr:""};
 // Official PTC description (Creo Configuration Options reference)
 let en=(typeof CREO_DESC!=="undefined"&&CREO_DESC[n])?CREO_DESC[n]:"";
 // WHATNEW / Turkish
 const wn=(typeof WHATNEW!=="undefined"?WHATNEW:[]).find(o=>o.name===n);
 let tr=wn&&wn.tr?wn.tr:"";
 if(!tr&&OPTHELP[n])tr=OPTHELP[n];
 if(!en&&wn)en=wn.en||"";
 if(!en&&!tr){
  const parts=n.split("_").filter(Boolean);
  tr="«"+parts.join(" ")+"» seçeneği Creo davranışını yapılandırır. Ayrıntı için Configuration Editor açıklamasına bakın.";
  en="";
 }
 return {en,tr};
}
function hideOptTip(){
 clearTimeout(optTipTimer);optTipTimer=null;optTipOpt=null;
 const tip=$("optTip");if(tip)tip.style.display="none";
}
function showOptTip(el,name){
 const tip=$("optTip");if(!tip||!el)return;
 const rect=el.getBoundingClientRect();
 tip.innerHTML=`<div class="ot-name">${escapeHtml(name)}</div><div class="ot-body ot-wait">${escapeHtml(t("opt_wait"))}</div>`;
 tip.style.display="block";
 let left=rect.left, top=rect.bottom+6;
 if(left+380>innerWidth)left=Math.max(8,innerWidth-390);
 if(top+140>innerHeight)top=Math.max(8,rect.top-8-140);
 tip.style.left=left+"px";tip.style.top=top+"px";
 clearTimeout(optTipTimer);
 optTipTimer=setTimeout(()=>{
  const {en,tr}=explainOpt(name);
  let body="";
  if(tr) body+=`<div class="ot-tr">${escapeHtml(tr)}</div>`;
  if(en) body+=`<div class="ot-en">${escapeHtml(en)}</div>`;
  if(!en&&!tr) body+=`<div class="ot-body">${escapeHtml(t("opt_none"))}</div>`;
  tip.innerHTML=`<div class="ot-name">${escapeHtml(name)}</div>${body}<div class="ot-ai">${escapeHtml(t("opt_ai"))}</div>`;
  const th=tip.offsetHeight;
  if(rect.bottom+6+th>innerHeight)tip.style.top=Math.max(8,rect.top-th-6)+"px";
 },1200);
}
function bindOptTips(root){
 if(!root)return;
 root.querySelectorAll("b.opt").forEach(el=>{
  el.onmouseenter=()=>{optTipOpt=el.dataset.opt;showOptTip(el,el.dataset.opt)};
  el.onmouseleave=()=>hideOptTip();
 });
}

function renderView(){
 const x=find(cur),box=$("vCode");$("vsearch").disabled=$("vCopy").disabled=$("vRestore").disabled=!x;
 if(!x){box.className="wbody gradient";box.innerHTML=`<div class="emptyv">${t("empty_view")}</div>`;$("vTitle").textContent="";$("vCount").textContent="";return}
 $("vTitle").textContent=`${x.name}${x.tag?" ["+x.tag+"]":""}`;
 const q=$("vsearch").value.toLowerCase(),lines=x.text.split(/\r?\n/).map((s,i)=>[i+1,s]),hit=q?lines.filter(l=>l[1].toLowerCase().includes(q)):lines;
 box.className="wbody code";
 box.innerHTML=hit.map(([n,s])=>{const k=s.trim(),cm=k[0]==="!"||k[0]==="#";
  let body;
  if(cm){body=`<span class="cm">${escapeHtml(s)||" "}</span>`}
  else{
    const m=s.match(/^(\s*)(\S+)([\s\S]*)$/);
    if(m){const opt=m[2].toLowerCase();body=`${escapeHtml(m[1])}<b class="opt" data-opt="${escapeHtml(opt)}">${escapeHtml(m[2])}</b>${escapeHtml(m[3])}`}
    else body=escapeHtml(s)||" ";
  }
  return `<div class="ln"><i>${n}</i><span>${body}</span></div>`}).join("")||`<div class="empty">${t("no_line")}</div>`;
 bindOptTips(box);
 $("vCount").textContent=`${humanDate(x.date)} · ${sizeText(x.size)} · `+(q?t("lines_m",hit.length,lines.length):t("lines",lines.length))}

  const m=s.match(/^([^\s=]+)\s*(?:=|\s)\s*(.*?)\s*$/);if(m){const k=m[1].toLowerCase();if(!map.has(k))map.set(k,[]);map.get(k).push(m[2])}});return map}

 if(!can){out.className="muted";out.textContent=t("c_need");return}
 if(!a||!b||a.id===b.id){out.className="muted";out.textContent=t("c_hint");return}
 const A=parseConfig(a.text),B=parseConfig(b.text),rows=[];let ad=0,rm=0,ch=0,same=0;
 const add=(k,v)=>{ad++;rows.push({kind:"add",html:`<div class="add" data-kind="add">+ ${escapeHtml(k)} ${escapeHtml(v)}</div>`})};
 const del=(k,v)=>{rm++;rows.push({kind:"remove",html:`<div class="remove" data-kind="remove">− ${escapeHtml(k)} ${escapeHtml(v)}</div>`})};
 for(const k of [...new Set([...A.keys(),...B.keys()])].sort()){
  const va=A.get(k)||[],vb=B.get(k)||[];
  if(!va.length)vb.forEach(v=>add(k,v));
  else if(!vb.length)va.forEach(v=>del(k,v));
  else if(va.length===1&&vb.length===1){
   if(va[0]!==vb[0]){ch++;rows.push({kind:"change",html:`<div class="change" data-kind="change">~ ${escapeHtml(k)}: ${wordDiff(va[0],vb[0])}</div>`})}
   else{same++;rows.push({kind:"same",html:`<div class="same" data-kind="same" style="color:#6a7580">= ${escapeHtml(k)} ${escapeHtml(va[0])}</div>`})}
  }else{
   const sa=new Set(va),sb=new Set(vb),na=vb.filter(v=>!sa.has(v)),nr=va.filter(v=>!sb.has(v));
   na.forEach(v=>add(k,v));nr.forEach(v=>del(k,v));
   if(!na.length&&!nr.length){same++;va.forEach(v=>rows.push({kind:"same",html:`<div class="same" data-kind="same" style="color:#6a7580">= ${escapeHtml(k)} ${escapeHtml(v)}</div>`}))}
  }
 }
 const chip=(kind,cls,label,n)=>{
  const on=cmpFilter[kind];
  return `<button type="button" class="chip ${cls}${on?" on":""}" data-ckind="${kind}" title="${escapeHtml(t("c_filter_tip"))}"><b>${label}</b> ${n}</button>`;
 };
 const visible=rows.filter(r=>cmpFilter[r.kind]);
 out.className="";
 out.innerHTML=`<div class="sline"><span><b>${escapeHtml(a.name)}</b> ${t("c_vs")} <b>${escapeHtml(b.name)}</b></span>${chip("add","addc","+ "+t("c_added"),ad)}${chip("remove","remc","− "+t("c_removed"),rm)}${chip("change","chgc","~ "+t("c_changed"),ch)}${chip("same","samc","= "+t("c_same"),same)}</div><div class="diff" id="cmpDiff">${visible.length?visible.map(r=>r.html).join(""):`<span class="muted">${t("c_none")}</span>`}</div><p class="muted" style="font-size:11px">${t("c_note")} · ${t("c_filter_help")}</p>`;
 out.querySelectorAll(".chip").forEach(btn=>{
  btn.onclick=()=>{const k=btn.dataset.ckind;cmpFilter[k]=!cmpFilter[k];drawCompare()};
 });
}

let wnFilter="all";
function renderWhatsNew(){
 const q=($("wnSearch")?.value||"").toLowerCase();
 const wnMap={};WHATNEW.forEach(o=>wnMap[o.name]=o);
 let names=Object.keys(CREO_DESC);
 WHATNEW.forEach(o=>{if(!(o.name in CREO_DESC))names.push(o.name)});
 if(wnFilter==="new")names=names.filter(n=>wnMap[n]&&wnMap[n].status==="new");
 else if(wnFilter==="deleted")names=names.filter(n=>wnMap[n]&&wnMap[n].status==="deleted");
 else if(wnFilter==="changed")names=names.filter(n=>wnMap[n]&&wnMap[n].status==="changed");
 names.sort();
 const rows=names.filter(n=>{const o=wnMap[n]||{};const en=CREO_DESC[n]||o.en||"";const tr=o.tr||OPTHELP[n]||"";return !q||n.includes(q)||en.toLowerCase().includes(q)||tr.toLowerCase().includes(q)});
 const badge=n=>{const o=wnMap[n];if(!o)return"";if(o.status==="new")return `<span class="status">${t("wn_new")}</span>`;if(o.status==="changed")return `<span class="status" style="border-color:#e0c060;color:var(--amber);background:#fdf6e3">${t("wn_chg")}</span>`;return `<span class="status" style="border-color:#e0a0a0;color:var(--red);background:#fdeeee">${t("wn_del")}</span>`};
 let h=`<p class="muted" style="margin:0 0 10px;font-size:11px">${t("wn_ai")} <a href="https://www.ptc.com/support/-/media/support/refdocs/Creo_Parametric/13/configoptionscreopma13400.pdf?sc_lang=en" target="_blank" rel="noopener">${t("wn_pdf")}</a></p>`;
 if(!rows.length){h+=`<div class="empty">${t("wn_none")}</div>`;$("wnBody").innerHTML=h;return}
 h+=`<table style="width:100%;border-collapse:collapse;font-size:12px">
 <thead><tr style="background:#f0f3f6;text-align:left">
 <th style="padding:4px 6px;border-bottom:1px solid var(--bd)">Option</th>
 <th style="padding:4px 6px;border-bottom:1px solid var(--bd);width:70px"></th>
 <th style="padding:4px 6px;border-bottom:1px solid var(--bd)">EN</th>
 <th style="padding:4px 6px;border-bottom:1px solid var(--bd)">${t("wn_col_tr")}</th>
 </tr></thead><tbody>`;
 rows.forEach(n=>{
  const o=wnMap[n]||{};const en=CREO_DESC[n]||o.en||"";const tr=o.tr||OPTHELP[n]||"";
  h+=`<tr style="vertical-align:top;border-bottom:1px solid #e8ebef">
  <td style="padding:5px 6px;font-family:Consolas,monospace;white-space:nowrap"><b>${escapeHtml(n)}</b></td>
  <td style="padding:5px 6px">${badge(n)}</td>
  <td style="padding:5px 6px;color:#333">${escapeHtml(en)}</td>
  <td style="padding:5px 6px;color:#1e3a5f">${escapeHtml(tr)}</td>
  </tr>`});
 h+=`</tbody></table>`;
 $("wnBody").innerHTML=h;
}
